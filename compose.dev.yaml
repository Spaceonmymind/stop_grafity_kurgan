services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: stop-graffiti-kurgan-bot:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bot__Token: ${BOT_TOKEN:?BOT_TOKEN is required}
      Bot__UseLongPolling: "true"
      Bot__ReviewerChatId: ${REVIEWER_CHAT_ID:-}
      Bot__WebhookSecret: ""
      Bot__DataDirectory: /app/data
      Bot__VikaApiBaseUrl: ${VIKA_API_BASE_URL:-}
      Bot__VikaApiToken: ${VIKA_API_TOKEN:-}
      Bot__VikaCallbackToken: ${VIKA_CALLBACK_TOKEN:-}
    volumes:
      - bot_dev_data:/app/data

volumes:
  bot_dev_data:
