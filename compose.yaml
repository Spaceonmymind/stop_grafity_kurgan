services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: stop-graffiti-kurgan-bot:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bot__Token: ${BOT_TOKEN:?BOT_TOKEN is required}
      Bot__UseLongPolling: "false"
      Bot__ReviewerChatId: ${REVIEWER_CHAT_ID:-}
      Bot__WebhookSecret: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      Bot__DataDirectory: /app/data
    volumes:
      - bot_data:/app/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: "vi-common_vi"
      traefik.http.routers.stop-graffiti-kurgan.entrypoints: "http"
      traefik.http.routers.stop-graffiti-kurgan.rule: "Host(`${DOMAIN:?DOMAIN is required}`)"
      traefik.http.routers.stop-graffiti-kurgan.middlewares: "redirect-to-https@file"
      traefik.http.routers.stop-graffiti-kurgan-ssl.entrypoints: "https"
      traefik.http.routers.stop-graffiti-kurgan-ssl.rule: "Host(`${DOMAIN:?DOMAIN is required}`)"
      traefik.http.routers.stop-graffiti-kurgan-ssl.tls: "true"
      traefik.http.routers.stop-graffiti-kurgan-ssl.tls.certresolver: "letsEncrypt"
      traefik.http.services.stop-graffiti-kurgan.loadbalancer.server.port: "8080"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: vi-common_vi

volumes:
  bot_data:
